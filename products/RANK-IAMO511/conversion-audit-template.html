<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plantilla de auditoría de conversión</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; color: #1b1b1b; }
    .section { margin-bottom: 20px; padding: 16px; border: 1px solid #dfe3ea; border-radius: 12px; }
    label { display: block; margin: 10px 0 6px; font-weight: bold; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #cfd8e3; border-radius: 8px; }
    textarea { min-height: 110px; }
  </style>
</head>
<body>
  <h1>Auditoría rápida de conversión</h1>
  <div class="section">
    <label>URL revisada</label>
    <input value="https://example.com/servicio" />
    <label>Contacto visible</label>
    <input value="Teléfono / WhatsApp / formulario" />
    <label>Principal bloqueo</label>
    <textarea>Teléfono oculto / WhatsApp roto / CTA no visible / formulario sin foco / móvil lento</textarea>
  </div>
  <div class="section">
    <label>Corrección aplicada</label>
    <textarea>Se ha reubicado el botón de contacto, se ha restaurado el numero visible, y se ha reforzado la CTA principal.</textarea>
    <label>Resultado esperado</label>
    <textarea>Más llamadas, más WhatsApp y más formularios enviados.</textarea>
  </div>
</body>
</html>
