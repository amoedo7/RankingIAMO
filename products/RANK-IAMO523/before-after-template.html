<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Before / After Report</title>
  <style>
    body { font-family: Arial, sans-serif; color: #1c1c1c; margin: 2rem; line-height: 1.5; }
    .wrap { max-width: 800px; margin: 0 auto; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 1.2rem; margin: 1rem 0; }
    h1 { font-size: 2rem; }
    .bad { background: #fff4f4; border-left: 4px solid #d92d2d; }
    .good { background: #f3fff4; border-left: 4px solid #2f8f4a; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Informe de accesibilidad y UX</h1>
    <div class="card bad">
      <h2>Antes</h2>
      <ul>
        <li>Texto con contraste bajo</li>
        <li>Botón de contacto poco visible</li>
        <li>Formulario sin labels claros</li>
      </ul>
    </div>
    <div class="card good">
      <h2>Después</h2>
      <ul>
        <li>Contraste mejorado</li>
        <li>CTA visible y legible</li>
        <li>Formulario con labels accesibles</li>
      </ul>
    </div>
  </div>
</body>
</html>
