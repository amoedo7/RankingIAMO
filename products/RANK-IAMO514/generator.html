<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factura Clara ES</title>
<style>
:root{--brand:#2457d6;--ink:#172033;--muted:#60708d;--line:#d9e0ec;--paper:#fff;--bg:#f2f5fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.layout{display:grid;grid-template-columns:minmax(300px,430px) minmax(320px,1fr);gap:24px;max-width:1250px;margin:auto;padding:24px}.panel,.document{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px #17203312}.panel{padding:20px}.document{padding:34px;min-height:700px}h1{font-size:24px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}label{display:block;font-weight:700;font-size:12px;margin:9px 0 4px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:9px;border:1px solid #bdc8da;border-radius:7px;background:#fff}textarea{min-height:54px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.line{display:grid;grid-template-columns:1fr 68px 92px 30px;gap:6px;align-items:end;margin-bottom:7px}.line label{font-size:10px}.remove{padding:8px 0;border:0;background:#fff;color:#b42318;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:7px;padding:10px 13px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e8eefc;color:#173c9a}.hint{color:var(--muted);font-size:12px}.dochead{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--brand);padding-bottom:22px}.brand{font-size:22px;font-weight:800;color:var(--brand)}.docmeta{text-align:right}.parties{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:25px 0}.small{color:var(--muted);white-space:pre-line}.doc-table{width:100%;border-collapse:collapse;margin-top:20px}.doc-table th{text-align:left;background:#eef3ff;color:#173c9a}.doc-table th,.doc-table td{padding:9px;border-bottom:1px solid var(--line)}.num{text-align:right}.totals{margin:22px 0 0 auto;max-width:310px}.totalrow{display:flex;justify-content:space-between;padding:5px 0}.grand{font-size:20px;font-weight:800;border-top:2px solid var(--ink);margin-top:5px;padding-top:9px}.terms{margin-top:30px;padding:13px;background:#f7f9fc;border-radius:8px}.screen-only{display:block}@media(max-width:850px){.layout{grid-template-columns:1fr}.document{padding:20px}}@media print{body{background:#fff}.layout{display:block;padding:0}.panel,.screen-only{display:none!important}.document{border:0;box-shadow:none;border-radius:0;padding:0}.document{min-height:0}@page{margin:15mm}}
</style>
</head>
<body>
<div class="layout">
<section class="panel screen-only">
<h1>Factura Clara ES</h1><p class="hint">Completá los campos y generá un documento imprimible. Los datos permanecen en esta pestaña.</p>
<h2>Documento</h2><div class="row"><div><label for="kind">Tipo</label><select id="kind"><option>Presupuesto</option><option>Factura</option></select></div><div><label for="number">Número</label><input id="number" value="2026-001"></div></div>
<div class="row"><div><label for="date">Fecha</label><input id="date" type="date"></div><div><label for="due">Vencimiento</label><input id="due" type="date"></div></div>
<h2>Emisor</h2><div class="row"><div><label for="seller">Nombre / razón social</label><input id="seller" placeholder="Tu nombre o empresa"></div><div><label for="nif">NIF</label><input id="nif" placeholder="NIF / CIF"></div></div><label for="sellerAddress">Dirección</label><textarea id="sellerAddress" placeholder="Calle, ciudad y código postal"></textarea><div class="row"><div><label for="sellerEmail">Correo</label><input id="sellerEmail" type="email"></div><div><label for="sellerPhone">Teléfono</label><input id="sellerPhone"></div></div>
<h2>Cliente</h2><label for="buyer">Nombre / razón social</label><input id="buyer" placeholder="Cliente"><div class="row"><div><label for="buyerNif">NIF</label><input id="buyerNif"></div><div><label for="buyerEmail">Correo</label><input id="buyerEmail" type="email"></div></div><label for="buyerAddress">Dirección</label><textarea id="buyerAddress"></textarea>
<h2>Conceptos</h2><div id="lines"></div><button class="secondary" type="button" id="add">+ Añadir línea</button>
<div class="row"><div><label for="vat">IVA (%)</label><input id="vat" type="number" min="0" step="0.01" value="21"></div><div><label for="discount">Descuento (%)</label><input id="discount" type="number" min="0" max="100" step="0.01" value="0"></div></div><label for="termsInput">Condiciones de pago</label><textarea id="termsInput">Pago por transferencia bancaria a 15 días.</textarea><div class="actions"><button type="button" id="update">Actualizar documento</button><button type="button" id="print">Imprimir / guardar PDF</button></div>
</section>
<main class="document" id="document"></main>
</div>
<script>
const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addLine(value={description:'',qty:1,price:0}){const row=document.createElement('div');row.className='line';row.innerHTML=`<div><label>Descripción</label><input class="desc" value="${esc(value.description)}"></div><div><label>Cant.</label><input class="qty" type="number" min="0" step="0.01" value="${value.qty}"></div><div><label>Precio sin IVA</label><input class="price" type="number" min="0" step="0.01" value="${value.price}"></div><button class="remove" type="button" aria-label="Quitar línea">×</button>`;row.querySelector('.remove').onclick=()=>{row.remove();update()};$('lines').append(row)}
function val(id){return $(id).value.trim()}function dateText(id){const v=val(id);return v?new Date(v+'T00:00:00').toLocaleDateString('es-ES'):''}
function update(){const rows=[...document.querySelectorAll('.line')].map(r=>({description:r.querySelector('.desc').value,qty:Number(r.querySelector('.qty').value)||0,price:Number(r.querySelector('.price').value)||0}));const sub=rows.reduce((a,r)=>a+r.qty*r.price,0);const discount=Math.min(100,Math.max(0,Number(val('discount'))||0));const base=sub*(1-discount/100);const vat=Math.max(0,Number(val('vat'))||0);const tax=base*vat/100;const total=base+tax;const title=val('kind')||'Presupuesto';const seller=val('seller')||'Nombre del emisor';const buyer=val('buyer')||'Cliente';$('document').innerHTML=`<div class="dochead"><div><div class="brand">${esc(seller)}</div><div class="small">${esc(val('sellerAddress'))}<br>${esc(val('sellerEmail'))} ${esc(val('sellerPhone'))}<br>${esc(val('nif'))}</div></div><div class="docmeta"><h1>${esc(title)}</h1><div>N.º ${esc(val('number'))}</div><div>Emisión: ${esc(dateText('date'))}</div><div>Vencimiento: ${esc(dateText('due'))}</div></div></div><div class="parties"><div><strong>CLIENTE</strong><div>${esc(buyer)}</div><div class="small">${esc(val('buyerAddress'))}<br>${esc(val('buyerEmail'))}<br>${esc(val('buyerNif'))}</div></div><div><strong>RESUMEN</strong><div class="small">Documento preparado con Factura Clara ES.<br>Revisá todos los datos antes de enviarlo.</div></div></div><table class="doc-table"><thead><tr><th>Concepto</th><th class="num">Cantidad</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.description||'Sin descripción')}</td><td class="num">${r.qty.toFixed(2)}</td><td class="num">${money(r.price)}</td><td class="num">${money(r.qty*r.price)}</td></tr>`).join('')}</tbody></table><div class="totals"><div class="totalrow"><span>Subtotal</span><span>${money(sub)}</span></div><div class="totalrow"><span>Descuento (${discount.toFixed(2)}%)</span><span>- ${money(sub*discount/100)}</span></div><div class="totalrow"><span>Base imponible</span><span>${money(base)}</span></div><div class="totalrow"><span>IVA (${vat.toFixed(2)}%)</span><span>${money(tax)}</span></div><div class="totalrow grand"><span>Total</span><span>${money(total)}</span></div></div><div class="terms"><strong>Condiciones de pago</strong><br>${esc(val('termsInput'))}</div>`)}
$('add').onclick=()=>{addLine();update()};$('update').onclick=update;$('print').onclick=()=>{update();window.print()};['kind','number','date','due','seller','nif','sellerAddress','sellerEmail','sellerPhone','buyer','buyerNif','buyerEmail','buyerAddress','vat','discount','termsInput'].forEach(id=>$(id).addEventListener('input',update));$('date').value=new Date().toISOString().slice(0,10);addLine({description:'Servicio profesional',qty:1,price:0});update();
</script>
</body>
</html>
