name: IAMOX manual bootstrap birth

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Emergency/bootstrap births to create manually (1-10)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: iamox-live-system
  cancel-in-progress: false

jobs:
  birth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify IAMOX runtime
        working-directory: iamox
        run: python -m unittest discover -v -p "test_*.py"
      - name: Create bootstrap identity
        env:
          IAMOX_COUNT: ${{ github.event.inputs.count || '1' }}
        run: python iamox/spawn.py --count "$IAMOX_COUNT" --birthplace "github:amoedo7/RankingIAMO:manual"
      - name: Materialize brain, memory and world state
        env:
          IAMOX_REPRODUCTION_ENABLED: "0"
        run: python iamox/runner.py
      - name: Persist manual birth
        run: |
          git config user.name "IAMOX Bootstrap Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add data/competitors.json iamox/state iamox/tasks iamox/cells iamox/handoffs iamox/reports iamox/world
          if git diff --cached --quiet; then
            echo "No bootstrap changes."
            exit 0
          fi
          git commit -m "birth(iamox): manual bootstrap override"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Summary
        run: |
          echo "### IAMOX manual bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "Normal reproduction is driven by the living heartbeat. This workflow is only an explicit manual override." >> "$GITHUB_STEP_SUMMARY"
