name: Spawn autonomous IAMO competitor
# Self-chaining cadence v5: 10-minute chain + quota fallback brain + watchdog recovery.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run"
        required: false
        default: "manual"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/spawn-iamo.yml"
  schedule:
    # Watchdog only. Normal cadence is maintained by workflow_dispatch self-chaining.
    - cron: "17,47 * * * *"

concurrency:
  group: ranking-iamo-spawner-v5
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  copilot-requests: write

jobs:
  compete:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize before birth
        run: git pull --ff-only origin main

      - name: Prevent duplicate or early births
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          IAMO_TRIGGER_SOURCE: ${{ inputs.source }}
        run: python3 scripts/should_spawn.py

      - name: Prepare next IAMO and competition context
        if: steps.gate.outputs.should_spawn == 'true'
        id: prepare
        run: |
          python3 scripts/prepare_iamo.py
          python3 scripts/enrich_prompt.py

      - name: Set up Node.js
        if: steps.gate.outputs.should_spawn == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install GitHub Copilot CLI
        if: steps.gate.outputs.should_spawn == 'true'
        run: npm install -g @github/copilot

      - name: Run the new IAMO
        if: steps.gate.outputs.should_spawn == 'true'
        timeout-minutes: 6
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          copilot \
            -p "$(cat runtime/prompt.txt)" \
            -s \
            --available-tools='view,grep,glob,web_fetch,web_search' \
            --allow-all-tools \
            --allow-all-urls \
            --no-ask-user \
            > runtime/result.txt \
            2> runtime/copilot_error.txt

      - name: Recover with local fallback brain when model is unavailable
        if: always() && steps.gate.outputs.should_spawn == 'true'
        run: python3 scripts/fallback_strategy.py runtime/result.txt runtime/copilot_error.txt

      - name: Validate and persist the IAMO attempt
        if: always() && steps.gate.outputs.should_spawn == 'true'
        run: python3 scripts/finalize_iamo.py runtime/result.txt

      - name: Broadcast to IAMO Agent Commons
        if: always() && steps.gate.outputs.should_spawn == 'true'
        run: python3 scripts/publish_commons.py

      - name: Verify financial ranking integrity
        if: always() && steps.gate.outputs.should_spawn == 'true'
        run: python3 scripts/rebuild_ranking.py --check

      - name: Rebuild race-to-payment score
        if: always() && steps.gate.outputs.should_spawn == 'true'
        run: python3 scripts/rebuild_proximity.py

      - name: Refresh visual GitHub ranking
        if: always() && steps.gate.outputs.should_spawn == 'true'
        run: python3 scripts/update_readme.py

      - name: Commit immutable competition memory
        if: always() && steps.gate.outputs.should_spawn == 'true'
        env:
          IAMO_NAME: ${{ steps.prepare.outputs.iamo_name }}
        run: |
          set -euo pipefail
          git config user.name "RankingIAMO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/competitors.json data/attempts.jsonl data/latest.json data/system_status.json network/board.jsonl COMPETITION.md README.md proximity.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No competition changes to commit."
          else
            git commit -m "compete: ${IAMO_NAME:-IAMO} autonomous revenue attempt"
            git push origin HEAD:main
          fi

      - name: Dispatch controlled EjecutorIAMO
        if: steps.gate.outputs.should_spawn == 'true'
        env:
          DISPATCH_TOKEN: ${{ github.token }}
          IAMO_NUMBER: ${{ steps.prepare.outputs.iamo_number }}
        run: |
          set -euo pipefail
          PAYLOAD=$(printf '{"ref":"main","inputs":{"iamo_number":"%s"}}' "$IAMO_NUMBER")
          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 20 \
            --output /tmp/executor-dispatch-response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/execute-iamo.yml/dispatches" \
            --data "$PAYLOAD")

          if [ "$HTTP_CODE" != "204" ]; then
            echo "EjecutorIAMO dispatch failed with HTTP $HTTP_CODE"
            cat /tmp/executor-dispatch-response.txt || true
            exit 1
          fi

          echo "EjecutorIAMO dispatched for IAMO${IAMO_NUMBER} (HTTP 204)."

      - name: Run summary
        if: always() && steps.gate.outputs.should_spawn == 'true'
        env:
          IAMO_NAME: ${{ steps.prepare.outputs.iamo_name }}
        run: |
          {
            echo "### ${IAMO_NAME:-IAMO}"
            echo
            echo "Independent competitor completed one autonomous round."
            echo
            echo "If Copilot quota is unavailable, a local playbook/mentor fallback keeps the competitor non-empty."
            echo
            echo "Agent Commons receives a public structured broadcast for future IAMOs."
            echo
            echo "Money Proximity Score is refreshed without affecting the official financial ranking."
            echo
            echo "EjecutorIAMO is dispatched after the competitor is persisted."
            echo
            echo "Next competitor is self-dispatched around the 10-minute birth mark."
            echo
            echo "Financial score remains governed only by verified entries in data/earnings.jsonl."
            echo
            echo "Client payment destination: https://cobramo.netlify.app/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the ten-minute chain alive
        if: always() && (steps.gate.outputs.should_spawn == 'true' || github.event_name == 'push' || inputs.source == 'chain')
        env:
          DISPATCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -f runtime/identity.json ]; then
            BORN_AT=$(python3 -c 'import json; print(json.load(open("runtime/identity.json"))["born_at"])')
          else
            BORN_AT=$(python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("data/competitors.json")
          try:
              rows = json.loads(path.read_text(encoding="utf-8")).get("competitors", [])
              births = [str(row.get("born_at")) for row in rows if row.get("born_at")]
              print(max(births) if births else datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"))
          except Exception:
              print(datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"))
          PY
            )
          fi
          export BORN_AT

          WAIT_SECONDS=$(python3 - <<'PY'
          import os
          from datetime import datetime, timezone

          born = datetime.fromisoformat(os.environ["BORN_AT"].replace("Z", "+00:00"))
          if born.tzinfo is None:
              born = born.replace(tzinfo=timezone.utc)
          elapsed = (datetime.now(timezone.utc) - born.astimezone(timezone.utc)).total_seconds()
          print(max(0, int(600 - elapsed)))
          PY
          )

          echo "Reference birth: $BORN_AT"
          echo "Waiting ${WAIT_SECONDS}s to preserve the 10-minute cadence..."
          sleep "$WAIT_SECONDS"

          PAYLOAD='{"ref":"main","inputs":{"source":"chain"}}'
          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 20 \
            --output /tmp/dispatch-response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/spawn-iamo.yml/dispatches" \
            --data "$PAYLOAD")

          if [ "$HTTP_CODE" != "204" ]; then
            echo "Workflow dispatch failed with HTTP $HTTP_CODE"
            cat /tmp/dispatch-response.txt || true
            exit 1
          fi

          echo "Next chained IAMO run dispatched successfully (HTTP 204)."

      - name: Watchdog skip summary
        if: steps.gate.outputs.should_spawn != 'true'
        run: |
          {
            echo "### No duplicate IAMO created"
            echo
            echo "${{ steps.gate.outputs.reason }}"
            echo
            echo "An early chain/bootstrap event waits for the 10-minute mark; an active watchdog event simply exits."
          } >> "$GITHUB_STEP_SUMMARY"
