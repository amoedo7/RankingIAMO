name: Spawn autonomous IAMO competitor

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes, offset from the top of the hour to reduce scheduler congestion.
    - cron: "3/10 * * * *"

concurrency:
  group: ranking-iamo-spawner
  cancel-in-progress: false

permissions:
  contents: write
  copilot-requests: write

jobs:
  compete:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize before birth
        run: git pull --ff-only origin main

      - name: Prepare next IAMO and competition context
        id: prepare
        run: python3 scripts/prepare_iamo.py

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run the new IAMO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          copilot \
            -p "$(cat runtime/prompt.txt)" \
            -s \
            --available-tools='view,grep,glob,web_fetch,web_search' \
            --allow-all-urls \
            --no-ask-user \
            > runtime/result.txt

      - name: Validate and persist the IAMO attempt
        run: python3 scripts/finalize_iamo.py runtime/result.txt

      - name: Verify financial ranking integrity
        run: python3 scripts/rebuild_ranking.py --check

      - name: Commit immutable competition memory
        env:
          IAMO_NAME: ${{ steps.prepare.outputs.iamo_name }}
        run: |
          set -euo pipefail
          git config user.name "RankingIAMO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/competitors.json data/attempts.jsonl data/latest.json COMPETITION.md
          git diff --cached --check
          git commit -m "compete: ${IAMO_NAME} autonomous revenue attempt"
          git push origin HEAD:main

      - name: Run summary
        env:
          IAMO_NAME: ${{ steps.prepare.outputs.iamo_name }}
        run: |
          {
            echo "### ${IAMO_NAME}"
            echo
            echo "New independent competitor completed one autonomous research/strategy round."
            echo
            echo "Financial score remains governed only by verified entries in data/earnings.jsonl."
            echo
            echo "Client payment destination: https://cobramo.netlify.app/"
          } >> "$GITHUB_STEP_SUMMARY"
