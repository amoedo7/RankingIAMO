name: IAMOX individual birth

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many IAMOX to create (1-10)"
        required: false
        default: "1"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: iamox-live-system
  cancel-in-progress: false

jobs:
  birth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify IAMOX runtime
        working-directory: iamox
        run: python -m unittest discover -v -p "test_*.py"
      - name: Create new identity
        env:
          IAMOX_COUNT: ${{ github.event.inputs.count || '1' }}
        run: python iamox/spawn.py --count "$IAMOX_COUNT"
      - name: Give the newborn its own brain, memory and world state
        run: python iamox/runner.py
      - name: Persist birth and first report
        run: |
          git config user.name "IAMOX Birth Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add data/competitors.json iamox/state iamox/tasks iamox/cells iamox/handoffs iamox/reports iamox/world
          if git diff --cached --quiet; then
            echo "No birth changes."
            exit 0
          fi
          NEWEST=$(python - <<'PY'
          import json
          data=json.load(open('data/competitors.json',encoding='utf-8'))
          rows=data.get('competitors',data) if isinstance(data,dict) else data
          print(rows[-1].get('name','IAMOX'))
          PY
          )
          git commit -m "birth(iamox): ${NEWEST} with individual runtime"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Summary
        run: |
          echo "### IAMOX individual birth" >> "$GITHUB_STEP_SUMMARY"
          echo "New IAMOX identities inherit the same organs, but receive their own deterministic brain signature, temperament, memory and coordinates." >> "$GITHUB_STEP_SUMMARY"
