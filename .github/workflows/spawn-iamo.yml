name: IAMOX population pulse

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this population pulse"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: ranking-iamox-population-pulse
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify IAMOX runtime
        working-directory: iamox
        run: python -m unittest -v test_runtime.py

      - name: Move existing IAMOX population
        run: python iamox/runtime.py

      - name: Persist population state
        run: |
          git config user.name "IAMOX Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add iamox/state iamox/tasks iamox/cells
          if git diff --cached --quiet; then
            echo "No IAMOX state changes."
            exit 0
          fi
          git commit -m "chore(iamox): population pulse"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "### IAMOX population pulse" >> "$GITHUB_STEP_SUMMARY"
          echo "No new IAMO was created. Existing agents were organized and advanced." >> "$GITHUB_STEP_SUMMARY"
          echo "Financial ranking remains governed by verified entries in data/earnings.jsonl." >> "$GITHUB_STEP_SUMMARY"
